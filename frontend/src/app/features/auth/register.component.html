<div class="auth-page auth-page-simple">
  <main class="auth-card">
    <div class="auth-card-inner register-inner"><a class="brand" routerLink="/login"><span
          class="brand-mark">A</span><span><strong>ambev</strong><small>sales control</small></span></a>
      <p class="eyebrow register-eyebrow">NOVO ACESSO</p>
      <h2>Criar usuário</h2>
      <p class="form-intro">Cadastre um operador para acessar o painel.</p>
      @if (error()) { <app-toast [message]="error()" [error]="true" /> } @if (success()) { <app-toast
        [message]="success()" /> }
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-grid">
          <div><label for="username">Nome</label><input id="username" formControlName="username"
              placeholder="Nome completo"><small class="field-error">{{ errorFor('username') }}</small></div>
          <div><label for="email">E-mail</label><input id="email" type="email" formControlName="email"
              placeholder="voce@empresa.com"><small class="field-error">{{ errorFor('email') }}</small></div>
          <div><label for="phone">Telefone</label><input id="phone" formControlName="phone"
              placeholder="+5511999999999"><small class="field-error">{{ errorFor('phone') }}</small></div>
          <div><label for="password">Senha</label><input id="password" type="password" formControlName="password"
              placeholder="Mínimo de 8 caracteres"><small class="field-error">{{ errorFor('password') }}</small></div>
          <div><label for="role">Perfil</label><select id="role" formControlName="role">
              <option [ngValue]="UserRole.Customer">Cliente</option>
              <option [ngValue]="UserRole.Manager">Gerente</option>
              <option [ngValue]="UserRole.Admin">Administrador</option>
            </select></div>
        </div><button class="button button-primary button-full" type="submit" [disabled]="loading()">{{ loading() ?
          'Criando...' : 'Criar acesso' }} <span>→</span></button>
      </form>
      <p class="auth-switch">Já possui uma conta? <a routerLink="/login">Voltar para login</a></p>
    </div>
  </main>
</div>
