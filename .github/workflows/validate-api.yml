name: Validate API

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: validate-api-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Ambev.DeveloperEvaluation.sln

      - name: Build solution
        run: dotnet build Ambev.DeveloperEvaluation.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Ambev.DeveloperEvaluation.sln --configuration Release --no-build --no-restore
